version: "3.9"
services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./app:/app/app", "./tests:/app/tests"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./app:/app/app"]
    command: celery -A app.core.celery_app worker --loglevel=info

  celery-beat:
    build: .
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["./app:/app/app"]
    command: celery -A app.core.celery_app beat --loglevel=info

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve_db
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

volumes:
  pgdata: